name: CI

on:
  push:
    branches: [ main, "feature/**", "security/**" ]
  pull_request:

jobs:
  backend:
    name: Backend (test + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopmart-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Test
        run: npm test
      - name: Security audit (advisory)
        run: npm audit --audit-level=high || true
